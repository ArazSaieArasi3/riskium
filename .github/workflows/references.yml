name: Reference corpus integrity
on:
  push:
    branches: [main]
    paths:
      - 'references/**'
      - 'ontology/riskium-model.json'
      - 'tools/review_references.py'
      - 'evaluation/references/**'
      - '.github/workflows/references.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/review_references.py --check
