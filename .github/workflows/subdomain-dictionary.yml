name: Source-bound subdomain dictionary
on:
  pull_request:
    paths:
      - 'diagrams/subdomain-relationships.svg'
      - 'diagrams/subdomain-relationships-matrix.svg'
      - 'documentation/concepts/0.3.1/**'
      - 'tools/build_subdomain_relationships.py'
      - 'tools/build_concept_dictionary.py'
      - '.github/workflows/subdomain-dictionary.yml'
  push:
    branches: [main]
    paths:
      - 'diagrams/subdomain-relationships.svg'
      - 'diagrams/subdomain-relationships-matrix.svg'
      - 'documentation/concepts/0.3.1/**'
      - 'tools/build_subdomain_relationships.py'
      - 'tools/build_concept_dictionary.py'
      - '.github/workflows/subdomain-dictionary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ce6f5573e2e0a698591615a7ded75c2f9451444
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_subdomain_relationships.py --check
      - run: python tools/build_concept_dictionary.py --check
      - run: python tools/audit_reader_consistency.py
