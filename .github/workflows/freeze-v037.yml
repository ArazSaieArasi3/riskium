name: v0.3.7 six-asset source freeze
on:
  workflow_run:
    workflows: [Nature-task reader for proposed v0.3.7]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: v037-freeze-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  freeze:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-shacl.txt -r tools/publication/requirements.txt
      - name: Authenticate exact main gates and independently downloaded evidence; freeze six assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          READER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python tools/releases/v037/selection.py --check
          python tools/releases/v037/freeze.py freeze --source "$SOURCE_SHA" --reader-run "$READER_RUN" --folder "$RUNNER_TEMP/v037-six-assets"
          git diff --exit-code
      - name: Independently check the finished six-asset inventory
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python tools/releases/v037/freeze.py verify --folder "$RUNNER_TEMP/v037-six-assets" --source "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: riskium-v037-six-assets-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/v037-six-assets/*
          if-no-files-found: error
          retention-days: 90
