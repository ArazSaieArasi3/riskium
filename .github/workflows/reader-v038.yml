# Historical filename retained; v0.3.8's qualified body remains in its source alias.
name: Coordinated v0.3.9 reader publication
on:
  push:
    branches: [main]
    paths: ['tools/releases/v039/delivery/**', 'evaluation/releases/v0.3.9/publication.json', '.github/workflows/reader-v038.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riskium-reader-main
  cancel-in-progress: false
jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - name: Verify bindings, render canonical bodies and audit routes
        run: |
          python tools/audit_reader_consistency.py
          python tools/releases/v039/delivery/build_reader.py --output build/site --wiki-output build/wiki
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-v039-${{ github.sha }}
          path: |
            build/wiki/
            build/site/publication-manifest.json
            build/site/delivery-validation.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact main before current-site promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
