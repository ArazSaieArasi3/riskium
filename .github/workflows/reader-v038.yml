name: Current v0.3.8 article companion reader
on:
  push:
    branches: [main]
    paths: ['tools/publication/v038_documentation.py', 'documentation/0.4.7/**', 'evaluation/releases/v0.3.8/publication.json', '.github/workflows/reader-v038.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riskium-reader-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      published: ${{ steps.phase.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - id: phase
        run: |
          if test -f evaluation/releases/v0.3.8/publication.json; then echo 'published=true' >> "$GITHUB_OUTPUT"; else echo 'published=false' >> "$GITHUB_OUTPUT"; fi
      - name: Build phase-correct reader and verify all local routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/publication/v038_documentation.py --output build/site --wiki-output build/wiki
          python -m unittest discover -s tests -p test_dictionary_documentation.py -v
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: reader-v038-${{ github.sha }}
          path: |
            build/wiki/
            build/site/dictionary-validation.json
      - uses: actions/upload-pages-artifact@v4
        if: steps.phase.outputs.published == 'true'
        with:
          path: build/site
  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact main before current-site promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
