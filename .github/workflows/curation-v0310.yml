name: Current curation v0.3.10 qualification

on:
  push:
    branches: [planning/v0.3.10-curation]
    paths:
      - 'tools/releases/v0310/**'
      - 'references/concept-definitions/0.2.0/**'
      - 'documentation/0.4.10/**'
      - '.github/workflows/curation-v0310.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curation-v0310-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded projection dependencies
        run: python -m pip install -r tools/releases/v0310/requirements.txt
      - name: Qualify current documentary component and staged projections
        run: python -B tools/releases/v0310/qualify.py --mode CI --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/curation-v0310"
      - uses: actions/upload-artifact@v4
        with:
          name: curation-v0310-${{ github.sha }}
          path: ${{ runner.temp }}/curation-v0310
          if-no-files-found: error
          retention-days: 30
