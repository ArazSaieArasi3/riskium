name: Assessment selection reader draft
on:
  push:
    branches: [plan/v0.3.6-assessment-selection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - name: Check candidate guide links, example, boundaries and 687 selected inputs
        run: |
          python tools/publication/review_assessment_reader.py
          python tools/publication/check_development_boundary.py
          git diff --exit-code
