name: Post-v0.3.6 source-qualified full suite
on:
  push:
    branches: [main, plan/v0.3.6-assessment-selection]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-shacl.txt -r tools/publication/requirements.txt
      - name: Verify current landing and replay each unchanged reader suite at its own source
        run: |
          python tools/publication/review_repository_landing.py
          python tools/run_v036_versioned_suite.py --list
          python tools/run_v036_versioned_suite.py --receipt build/versioned-suite.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: v036-source-suite-${{ github.sha }}
          path: build/versioned-suite.json
          if-no-files-found: error
