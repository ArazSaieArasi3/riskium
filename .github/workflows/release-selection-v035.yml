name: v0.3.5 component selection
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-shacl.txt -r tools/publication/requirements.txt
      - name: Validate exact component versions, current and historical prerequisites, source and output bindings
        run: python tools/select_release_v035.py --check
      - name: Reject damaged compatibility, source, inventory and scope contracts
        run: python -m unittest discover -s tests -p test_release_v035_selection.py -v
      - name: Preserve earlier source selection and recheck current source accounting and documentation
        run: |
          python tools/build_prepared_distribution.py --check
          python tools/audit_current_alignment.py --check
          python tools/publication/current_documentation.py --check
          python tools/audit_consistency.py --check
          git diff --exit-code
