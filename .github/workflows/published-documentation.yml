name: Published v0.3.5 reader documentation
on:
  workflow_run:
    workflows: [Incremental release candidate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: published-reader-documentation
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - name: Check the actual publication and additive documentation scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publication/published_documentation.py --check --live-release
      - name: Check failure boundaries and unchanged formal clause bodies
        run: python -m unittest discover -s tests -p test_published_documentation.py -v
      - name: Generate the final site and equivalent native Wiki projection
        run: |
          python tools/publication/published_documentation.py --output build/published-site --wiki-output build/published-wiki
          git diff --exit-code
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/published-site
      - uses: actions/upload-artifact@v4
        with:
          name: native-wiki-${{ github.event.workflow_run.head_sha }}
          path: build/published-wiki
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy maintained documentation with all four frozen snapshots
        id: deployment
        uses: actions/deploy-pages@v4
  readback:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - name: Download the actual native Wiki Git state
        run: git clone https://github.com/ArazSaieArasi3/riskium.wiki.git build/actual-wiki
      - name: Independently read every served body and compare the actual Wiki bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/publication/published_documentation.py --live-release
          --verify-channels build/actual-wiki --receipt build/actual-channel-readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: published-reader-readback-${{ github.event.workflow_run.head_sha }}
          path: build/actual-channel-readback.json
          if-no-files-found: error
