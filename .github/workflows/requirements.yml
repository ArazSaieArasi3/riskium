name: Requirement and CQ evidence
on:
  push:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'ontology/**'
      - 'tools/run_cq.py'
      - 'tools/build_traceability.py'
      - 'tools/requirements-owl.txt'
      - 'tests/test_cq.py'
      - 'evaluation/**'
      - '.github/workflows/requirements.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-owl.txt
      - name: Verify candidate source identity and prepare the reviewed historical checkout
        run: python tools/check_source_transition.py --historical-worktree build/reviewed-source --receipt build/source-boundary.json
      - run: python tools/run_cq.py --check
        working-directory: build/reviewed-source
      - run: python tools/build_traceability.py --check
        working-directory: build/reviewed-source
      - run: python -m unittest discover -s tests -p test_cq.py -v
        working-directory: build/reviewed-source
      - run: git diff --exit-code -- requirements evaluation/cq evaluation/traceability
        working-directory: build/reviewed-source
