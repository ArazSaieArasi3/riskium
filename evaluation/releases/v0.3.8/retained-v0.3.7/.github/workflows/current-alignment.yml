name: Current artifact and paper baseline alignment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-shacl.txt -r tools/publication/requirements.txt
      - name: Replay all four distinct SQL populations and their fixed controls
        run: |
          python tools/run_relational_source_scenario.py --check
          python tools/run_relational_source_scenario_lineage.py --check
          python tools/run_relational_evidence.py --check
          python tools/run_relational_evidence_lifecycle.py --check
      - name: Check 450 current routes, 306 dispositions and exact paper receipt bindings
        run: python tools/audit_current_alignment.py --check
      - name: Reject deliberately broken current evidence and claim routes
        run: python -m unittest discover -s tests -p test_current_alignment.py -v
      - name: Preserve prior components and the historical trace populations
        run: |
          python tools/build_prepared_distribution.py --check
          python tools/audit_consistency.py --check
          git diff 9a92ac92b29a127b1c38e6d0c052f8dc230dcb47 --exit-code -- evaluation/consistency/traceability.json evaluation/consistency/traceability.csv docs/traceability.md implementation/relational/0.7.0/contract.json implementation/relational/0.7.0/fixtures.json
          git diff --exit-code
