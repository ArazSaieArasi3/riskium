name: Current documentation 0.4.0 integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/publication/requirements.txt
      - name: Check reviewed current guide bodies, Wiki projection and full frozen-site preservation
        run: python tools/publication/current_documentation.py --check
      - name: Exercise source/version/link and projection failure boundaries
        run: python -m unittest discover -s tests -p test_current_documentation.py -v
      - name: Recheck current claim bindings and earlier publication selection
        run: |
          python tools/audit_current_alignment.py --check
          python tools/build_prepared_distribution.py --check
          python tools/audit_consistency.py --check
          git diff --exit-code
